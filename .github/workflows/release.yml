name: Release (manual, protected)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag to publish (for example v0.1.0)
        required: true
        type: string
      confirm:
        description: Type publish to confirm
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  validate:
    if: ${{ inputs.confirm == 'publish' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=aurora --cov-fail-under=80

  publish:
    needs: validate
    if: ${{ inputs.confirm == 'publish' && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aurora:${{ inputs.image_tag }}
