name: Container validation

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build OCI image
        run: docker build --pull -t aurora:ci .
      - name: Smoke test
        run: docker run --rm aurora:ci
      - name: Verify non-root image user
        run: test "$(docker image inspect aurora:ci --format '{{.Config.User}}')" = "10001:10001"
